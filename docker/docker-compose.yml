services:
  hermes-agent:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-agent
    command: gateway run
    ports:
      - "127.0.0.1:8642:8642"
      - "127.0.0.1:9119:9119"
    volumes:
      - ${HOST_HERMES_HOME:-${HOME}/.hermes}:/home/hermes/.hermes
      - ${HOST_HERMES_DATA:-${HOME}/hermes-data}:/opt/data/hermes-data
      - hermes-agent-src:/opt/hermes
    environment:
      - HERMES_HOME=/home/hermes/.hermes
      - HERMES_UID=${UID:-1000}
      - HERMES_GID=${GID:-1000}
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_HOST=0.0.0.0
      - HERMES_DASHBOARD_PORT=9119
      - API_SERVER_ENABLED=true
      - API_SERVER_KEY=${API_SERVER_KEY:-CHANGE_ME}
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_PORT=8642
    restart: unless-stopped
    networks:
      - hermes-net
  hermes-webui:
    image: ghcr.io/nesquena/hermes-webui:latest
    container_name: hermes-webui
    depends_on:
      - hermes-agent
    ports:
      - "8787:8787"
    volumes:
      - ${HOST_HERMES_HOME:-${HOME}/.hermes}:/home/hermeswebui/.hermes
      - ${HOST_HERMES_WEBUI_WORKSPACE:-${HOME}/hermes-data/hermes-webui/workspace}:/workspace
      - hermes-agent-src:/home/hermeswebui/.hermes/hermes-agent:ro
    environment:
      - HERMES_WEBUI_HOST=0.0.0.0
      - HERMES_WEBUI_PORT=8787
      - HERMES_WEBUI_STATE_DIR=/home/hermeswebui/.hermes/webui
      - HERMES_WEBUI_PASSWORD=${HERMES_WEBUI_PASSWORD:-}
      - HERMES_API_URL=http://hermes-agent:8642
      - GATEWAY_HEALTH_URL=http://hermes-agent:8642/health
      - HERMES_WEBUI_GATEWAY_BASE_URL=http://hermes-agent:8642
      - WANTED_UID=${UID:-1000}
      - WANTED_GID=${GID:-1000}
      - HERMES_NIX_BUILD=1
    restart: unless-stopped
    networks:
      - hermes-net
networks:
  hermes-net:
    driver: bridge

volumes:
  hermes-agent-src:
